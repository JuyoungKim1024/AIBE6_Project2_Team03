spring:
  profiles:
    active: dev,local

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB

  flyway:
    out-of-order: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}
          ssl:
            enable: ${SMTP_SSL_ENABLE:false}

logging:
  level:
    org.hibernate.SQL: debug
    org.flywaydb: debug

server:
  port: 8080

app:
  admin:
    email: ${ADMIN_EMAIL:keukeukkeu47@gmail.com}
    password: ${ADMIN_PASSWORD:}
  test-accounts:
    enabled: ${TEST_ACCOUNTS_ENABLED:true}
    password: ${TEST_ACCOUNT_PASSWORD:Test1234!}
  mail:
    from: ${MAIL_FROM:${SMTP_USERNAME:}}
  cookie:
    secure: ${COOKIE_SECURE:false}

cloudflare:
  r2:
    account-id: ${CLOUDFLARE_R2_ACCOUNT_ID}
    access-key-id: ${CLOUDFLARE_R2_ACCESS_KEY_ID}
    secret-access-key: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
    bucket-name: ${CLOUDFLARE_R2_BUCKET_NAME}
    public-url: ${CLOUDFLARE_R2_PUBLIC_URL}

gemini:
  api-key: ${GEMINI_API_KEY:}

toss:
  payments:
    secret-key: ${TOSS_SECRET_KEY:}
