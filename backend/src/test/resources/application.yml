spring:
  config:
    import: ""

  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

oauth:
  google:
    client-id: test-google-client-id
    client-secret: test-google-client-secret
    redirect-uri: http://localhost:8080/api/auth/google/callback
  kakao:
    client-id: test-kakao-client-id
    client-secret:
    redirect-uri: http://localhost:8080/api/auth/kakao/callback

app:
  frontend-url: http://localhost:3000
  jwt:
    secret: test-jwt-secret-change-before-production-32bytes
    access-token-validity-seconds: 3600
    refresh-token-validity-seconds: 1209600
